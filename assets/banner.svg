<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2" />
    </pattern>

    <!-- Dropshadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.5" />
    </filter>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>

    <style>
      @keyframes flowStroke {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(0.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-0.5deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.06); }
      }
      @keyframes beaconPulse {
        0% { r: 4; opacity: 1; }
        100% { r: 14; opacity: 0; }
      }

      .animated-flow {
        stroke-dasharray: 8 6;
        animation: flowStroke 2s linear infinite;
      }
      .animated-flow-reverse {
        stroke-dasharray: 8 6;
        animation: flowStroke 2.5s linear infinite reverse;
      }
      .node-card-1 {
        animation: floatSlow1 6s ease-in-out infinite;
        transform-origin: center;
      }
      .node-card-2 {
        animation: floatSlow2 7s ease-in-out infinite;
        transform-origin: center;
      }
      .glowing-bg {
        animation: pulseLight 5s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-ring {
        animation: beaconPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glow Lights (Background) -->
  <g class="glowing-bg">
    <circle cx="180" cy="140" r="240" fill="url(#cyanGlow)" />
    <circle cx="1020" cy="180" r="280" fill="url(#indigoGlow)" />
    <circle cx="600" cy="380" r="220" fill="url(#purpleGlow)" />
  </g>

  <!-- Animated Connection Flows (Midground - Behind Foreground Text) -->
  <g opacity="0.65">
    <!-- Left to Center Wire -->
    <path d="M 240 120 C 340 120, 360 210, 480 210" fill="none" stroke="#06b6d4" stroke-width="2.5" class="animated-flow" />
    <!-- Left Lower Wire -->
    <path d="M 230 310 C 360 310, 400 240, 520 240" fill="none" stroke="#6366f1" stroke-width="2" class="animated-flow-reverse" />
    <!-- Right Upper Wire -->
    <path d="M 960 120 C 860 120, 820 200, 720 200" fill="none" stroke="#a855f7" stroke-width="2.5" class="animated-flow-reverse" />
    <!-- Right Lower Wire -->
    <path d="M 970 300 C 850 300, 800 230, 680 230" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-flow" />
  </g>

  <!-- Floating Canvas Visual Nodes (Sides - Leaves Center Free) -->
  <!-- Left Side Floating Card: LLM Workflow -->
  <g class="node-card-1" filter="url(#shadow)">
    <rect x="50" y="80" width="190" height="74" rx="12" fill="url(#nodeGrad1)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="72" cy="104" r="8" fill="#06b6d4" fill-opacity="0.2" />
    <circle cx="72" cy="104" r="4" fill="#06b6d4" />
    <circle cx="72" cy="104" r="4" fill="none" stroke="#06b6d4" stroke-width="2" class="pulse-ring" />
    <text x="90" y="108" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Visual Flow Canvas</text>
    <text x="72" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Drag &amp; Drop Node Editor</text>
  </g>

  <!-- Left Bottom Floating Card: RAG & Knowledge Base -->
  <g class="node-card-2" filter="url(#shadow)">
    <rect x="50" y="270" width="190" height="74" rx="12" fill="url(#nodeGrad1)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="72" cy="294" r="8" fill="#6366f1" fill-opacity="0.2" />
    <circle cx="72" cy="294" r="4" fill="#6366f1" />
    <text x="90" y="298" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">RAG &amp; Vector Store</text>
    <text x="72" y="322" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Knowledge Connectors</text>
  </g>

  <!-- Right Upper Floating Card: MCP & Tools -->
  <g class="node-card-2" filter="url(#shadow)">
    <rect x="960" y="80" width="190" height="74" rx="12" fill="url(#nodeGrad1)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="982" cy="104" r="8" fill="#a855f7" fill-opacity="0.2" />
    <circle cx="982" cy="104" r="4" fill="#a855f7" />
    <circle cx="982" cy="104" r="4" fill="none" stroke="#a855f7" stroke-width="2" class="pulse-ring" />
    <text x="1000" y="108" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">MCP Protocol Hub</text>
    <text x="982" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">400+ Standard Tool APIs</text>
  </g>

  <!-- Right Bottom Floating Card: Multi-Agent Deployment -->
  <g class="node-card-1" filter="url(#shadow)">
    <rect x="960" y="270" width="190" height="74" rx="12" fill="url(#nodeGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="982" cy="294" r="8" fill="#38bdf8" fill-opacity="0.2" />
    <circle cx="982" cy="294" r="4" fill="#38bdf8" />
    <text x="1000" y="298" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Multi-Agent Bots</text>
    <text x="982" y="322" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Autonomous Operations</text>
  </g>

  <!-- FOREGROUND: High Contrast Typography & Core Branding -->
  <g id="foreground" text-anchor="middle">
    <!-- Top Category Pill -->
    <g filter="url(#pillGlow)">
      <rect x="420" y="52" width="360" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="438" cy="69" r="5" fill="#10b981" />
      <text x="606" y="74" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#textGlow)">
      AWESOME NO-CODE AGENT WORKSPACES
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="188" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Visual Canvases • Drag-and-Drop Orchestration • Autonomous Departmental Bots
    </text>

    <text x="600" y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
      Top SaaS Platforms &amp; Self-Hostable Open-Source Runtimes for AI Agent Builders
    </text>

    <!-- Center Feature Pills Bar (Foreground) -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="160" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="80" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎨 Visual Canvases</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(410, 0)">
        <rect x="0" y="0" width="170" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔌 MCP Standard APIs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(600, 0)">
        <rect x="0" y="0" width="180" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🏢 SaaS &amp; Enterprise</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(800, 0)">
        <rect x="0" y="0" width="170" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔓 Open-Source Runtimes</text>
      </g>
    </g>

    <!-- Bottom Metadata Status -->
    <text x="600" y="348" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      Last Updated: October 2026 • Verified Pricing, Free Tiers &amp; GitHub Star Ranks
    </text>
  </g>

  <!-- Accent Border Glow -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
